# This is a Declarative Automation Bundle definition for cloudflow_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cloudflow_databricks
  uuid: 6f64c6bd-233d-4cac-af91-542cce22ab7c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-66803fab-e2b6.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-66803fab-e2b6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/andrew.change.0515@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/andrew.change.0515@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: andrew.change.0515@outlook.com
        level: CAN_MANAGE
